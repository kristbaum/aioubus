[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aioubus"
dynamic = ["version"]
description = "Async client for OpenWrt's ubus HTTP/JSON-RPC API"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "kristbaum", email = "max@kristenonline.de" }]
requires-python = ">=3.14"
dependencies = ["aiohttp>=3.13", "yarl>=1.21"]
keywords = ["openwrt", "ubus", "rpcd", "luci", "asyncio", "home-assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/kristbaum/aioubus"
Issues = "https://github.com/kristbaum/aioubus/issues"
Changelog = "https://github.com/kristbaum/aioubus/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "trustme>=1.2",
  "ty>=0.0.85",
]

[tool.hatch.version]
path = "src/aioubus/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/aioubus", "tests", "README.md", "MIGRATION.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["live: tests against a real OpenWrt device (set AIOUBUS_LIVE_URL)"]

[tool.coverage.run]
source = ["aioubus"]
branch = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY001",  # no per-file copyright headers; see LICENSE
  "TC001", "TC002", "TC003",  # keep runtime imports; annotations are evaluated lazily anyway
  "COM812",  # conflicts with formatter
  "D203",    # incompatible with D211
  "D213",    # incompatible with D212
  "D100", "D101", "D102", "D103", "D105", "D107",  # docstrings on every item
  "EM101", "EM102", "TRY003",  # message strings in exceptions are fine
  "PLR0913", # client constructor has many options by design
  "A002",    # 'type' mirrors the UCI field name
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0917", "S105", "S108", "PLR2004", "SLF001", "ANN401", "D", "INP001", "FBT001", "ARG001"]
"scripts/**" = ["T201", "S310", "ANN401", "INP001", "PLR2004", "D"]
